
[functions]
  directory = "netlify/functions"

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Proxy API requests to Render
[[redirects]]
  from = "/api"
  to = "https://mellow-weather.onrender.com/api"
  status = 200
  force = true

[[redirects]]
  from = "/api/*"
  to = "https://mellow-weather.onrender.com/api/:splat"
  status = 200
  force = true

# React Router fallback
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
